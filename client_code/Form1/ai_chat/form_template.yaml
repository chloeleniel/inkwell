    name: reference
    properties: {text: reference}
    type: Button
  - layout_properties: {grid_position: ''}
    name: ai_chat
    properties: {text: AI Chat}
    type: Button
  - layout_properties: {grid_position: 'MKTPRP,CAKSWQ'}

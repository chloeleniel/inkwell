    type: Label
  - event_bindings: {}
    layout_properties: {grid_position: 'TXBXYC,HIXMLE'}
    name: done_button
    properties: {text: Done}
    type: Button
  - layout_properties: {grid_position: 'LSAMLZ,LMKGGO'}
    name: label_1
    properties: {bold: true, text: 'Enter your ideas:'}
    type: Label
  - data_bindings:
    - {code: 'self.item[''user_prompts'']', property: text, writeback: true}
    layout_properties: {grid_position: 'RDALLH,EIEUHG'}
    name: user_prompts
    properties: {}
    type: TextArea
  - layout_properties: {grid_position: 'ADLSMP,SLSXXD'}
    name: submit_button
    properties: {text: Submit}
    type: Button
  - components:
    - layout_properties: {grid_position: 'LLSWQM,GWKXUG'}
      name: label_2
      properties: {bold: true, text: 'Ponder:'}
      type: Label
    - layout_properties: {grid_position: 'VXIVLU,UCWJPE'}
      name: response_box
      properties: {}
      type: Label
    - layout_properties: {grid_position: 'ZKHDAB,MMTANN'}
      name: clear_button
      properties: {text: Next}
      type: Button
    layout_properties: {grid_position: 'NJYZSE,FWDIME'}
    name: response_card
    properties: {}
    type: ColumnPanel
  - components:
    - layout_properties: {}
      name: prompt_panel
      properties: {item_template: Form1.ai_chat.RowTemplate1}
      type: RepeatingPanel
    data_bindings: []
    layout_properties: {full_width_row: false, grid_position: 'KQNNLN,ZDCTUJ', row_background: ''}
    name: prompt_grid
    properties:
      background: theme:Gray 200
      columns:
      - {data_key: user_prompts, expand: false, id: JKSDUP, title: Prompt}
      - {data_key: responses, id: VJQQOR, title: Response}
      show_page_controls: true
    type: DataGrid
  layout_properties: {slot: default}
  name: content_panel
  properties: {col_widths: '{"FZZWPU":45,"HIXMLE":15}'}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
